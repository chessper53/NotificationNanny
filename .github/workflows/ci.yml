name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each check on its own line in a pull request, so a failure says what failed.
  version-consistency:
    name: Cask and Info.plist macOS version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test-version-consistency.sh

  release-workflow:
    name: Release workflow ships a verified binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test-release-workflow.sh

  e2e-verdicts:
    name: E2E verdict checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts/e2e -p 'test_*.py' -v

  test-groups:
    name: Every test suite is in a CI group
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test-ci-groups.sh

  build:
    name: Build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-spm-test-${{ hashFiles('Package.swift', 'Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-test-

      - name: Build app and tests
        run: swift build --build-tests

  # The unit tests in groups, one check each; after Build, from its cache. A failing
  # group doesn't stop the others. scripts/test-ci-groups.sh keeps every suite in one.
  test:
    name: Tests, ${{ matrix.name }}
    needs: build
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: settings and backup
            filter: 'NotificationNannyTests\.(AppGroupTests|AppSettingsPersistenceTests|AppSettingsTests|ApplyReportTests|BackupCompletenessTests|BackupKnownAppsTests|E2ESettingsTests|ExportSchemaTests|PresetTests|SettingsSnapshotTests|SnoozeTests|SoundGroupTests|TintMigrationTests)'
          - name: banners and placement
            filter: 'NotificationNannyTests\.(BannerDecisionTests|BannerDismissTimersTests|BannerPileGeometryTests|NotificationPositionGeometryTests|NotificationPositionTests|ParkedWindowHomeTests|PileOrderTests|ScreenPlacementTests)'
          - name: Notification Center panel and widgets
            filter: 'NotificationNannyTests\.(NCActionNamesTests|NCMenuTickTests|NCPanelModelTests|NCPanelOffsetTests|NCWidgetPlacementTests|WidgetBlankTests)'
          - name: diagnostics and system
            filter: 'NotificationNannyTests\.(AppIconCacheTests|AppNameFromDescriptionTests|AXIntegrationTests|AXStringTests|CrashDiagnosticsTests|InstalledAppIndexLocalizedNameTests|LogPrivacyTests|NannyLoggerTests)'
    steps:
      - uses: actions/checkout@v7

      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-spm-test-${{ hashFiles('Package.swift', 'Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-test-

      - name: Test
        run: swift test --filter '${{ matrix.filter }}'

  # Every test once more with coverage, for the summary in the log. Informational: the
  # groups above are the checks that pass or fail.
  coverage:
    name: Coverage (informational)
    needs: build
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-spm-test-${{ hashFiles('Package.swift', 'Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-test-

      - name: Test with coverage
        run: swift test --enable-code-coverage

      - name: Coverage summary
        run: |
          PROF=$(find .build -name '*.profdata' | head -1)
          # Skip the .dSYM bundle: it contains a DWARF file with the same name as
          # the test binary, and find hits it first. llvm-cov then rejects it with
          # "unsupported coverage format version".
          BIN=$(find .build -name 'NotificationNannyPackageTests' -type f \
                  -not -path '*.dSYM*' | head -1)
          if [ -n "$PROF" ] && [ -n "$BIN" ]; then
            xcrun llvm-cov report "$BIN" \
              -instr-profile "$PROF" \
              -ignore-filename-regex='Tests|\.build' \
              Sources/NotificationNannyCore
          else
            echo "Coverage artifacts not found (PROF='$PROF' BIN='$BIN'), skipping."
          fi

  bundle:
    name: Bundle smoke build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-spm-release-${{ hashFiles('Package.swift', 'Sources/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-release-

      # Assembles and ad-hoc signs NotificationNanny.app — catches packaging /
      # Info.plist / entitlements breakage that `swift build` alone won't.
      - name: Build .app bundle
        run: ./scripts/build-app.sh

      - name: Verify bundle
        run: |
          test -d build/NotificationNanny.app
          codesign --verify --verbose build/NotificationNanny.app

      # The bundle was already being built and then discarded. Keeping it lets a
      # testable .app come off a runner when no local toolchain can produce one.
      # ditto rather than zip, to preserve the code-signing xattrs the way
      # release.sh does; a plain zip can strip them and break the signature.
      - name: Package for download
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/NotificationNanny.app \
            build/NotificationNanny-ci.zip

      - name: Upload the built app
        uses: actions/upload-artifact@v4
        with:
          name: NotificationNanny-app-${{ github.sha }}
          path: build/NotificationNanny-ci.zip
          retention-days: 14
          if-no-files-found: error

name: Deploy landing page

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml, .github/workflows/site.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Validate this deployment's exact checkout, including direct pushes to main.
  validate:
    uses: ./.github/workflows/site.yml

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Collect the site
        run: |
          mkdir -p _site
          cp -R site/index.html site/main.js site/styles.css site/robots.txt site/sitemap.xml site/assets _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

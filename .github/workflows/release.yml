name: Release

on:
  release:
    types: [published]

jobs:
  build-and-update-cask:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build
        run: UNIVERSAL=1 ./build-app.sh

      - name: Verify universal binary
        run: |
          executable="build/NotificationNanny.app/Contents/MacOS/NotificationNanny"
          architectures="$(lipo -archs "$executable")"
          for architecture in arm64 x86_64; do
            if [[ " $architectures " != *" $architecture "* ]]; then
              echo "error: release binary is missing $architecture (found: $architectures)" >&2
              exit 1
            fi
          done

      - name: Zip
        run: cd build && zip -r "../NotificationNanny-${{ steps.version.outputs.version }}.zip" NotificationNanny.app

      - name: SHA256
        id: sha
        run: echo "sha256=$(shasum -a 256 "NotificationNanny-${{ steps.version.outputs.version }}.zip" | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Attach zip to release
        run: gh release upload "$GITHUB_REF_NAME" "NotificationNanny-${{ steps.version.outputs.version }}.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update cask
        run: |
          sed -i '' 's/version "[^"]*"/version "${{ steps.version.outputs.version }}"/' Casks/notificationnanny.rb
          sed -i '' 's/sha256 "[^"]*"/sha256 "${{ steps.sha.outputs.sha256 }}"/' Casks/notificationnanny.rb

      - name: Commit cask
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/notificationnanny.rb
          git commit -m "chore: bump cask to v${{ steps.version.outputs.version }}"
          git push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

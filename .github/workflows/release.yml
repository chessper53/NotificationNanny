name: Release

on:
  release:
    types: [published]

jobs:
  build-and-update-cask:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # Every release signed with the same certificate, so macOS keeps a user's
      # Accessibility and Screen Recording across updates (ad-hoc, each update was a
      # new app to allow again). A release without it fails rather than going out
      # ad-hoc: those who had allowed the last one would have to again.
      - name: Import signing certificate
        env:
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          if [[ -z "$SIGNING_P12" || -z "$SIGNING_P12_PASSWORD" ]]; then
            echo "error: SIGNING_P12 and SIGNING_P12_PASSWORD secrets are required to sign a release" >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass="$(uuidgen)"
          echo "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" >/dev/null
          rm -f "$RUNNER_TEMP/signing.p12"
          identity="$(security find-identity -p codesigning "$keychain" | awk '/"/ { print $2; exit }')"
          [[ -n "$identity" ]] || { echo "error: no signing identity in SIGNING_P12" >&2; exit 1; }
          echo "SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build
        run: UNIVERSAL=1 ./scripts/build-app.sh

      - name: Verify signature
        run: |
          requirement="$(codesign -dr - build/NotificationNanny.app 2>&1)"
          echo "$requirement"
          [[ "$requirement" == *"certificate leaf"* ]] || { echo "error: release is not signed with the certificate" >&2; exit 1; }

      - name: Verify universal binary
        run: |
          executable="build/NotificationNanny.app/Contents/MacOS/NotificationNanny"
          architectures="$(lipo -archs "$executable")"
          for architecture in arm64 x86_64; do
            if [[ " $architectures " != *" $architecture "* ]]; then
              echo "error: release binary is missing $architecture (found: $architectures)" >&2
              exit 1
            fi
          done

      - name: Zip
        run: cd build && zip -r "../NotificationNanny-${{ steps.version.outputs.version }}.zip" NotificationNanny.app

      - name: SHA256
        id: sha
        run: echo "sha256=$(shasum -a 256 "NotificationNanny-${{ steps.version.outputs.version }}.zip" | awk '{print $1}')" >> $GITHUB_OUTPUT

      # --clobber so the job can be re-run. Every release from 7.3.1 to 7.7.0
      # failed at "Commit cask" below, and re-running the job would have
      # collided with the zip this same job had already attached. Safe here
      # because this job is the only thing that builds, hashes and uploads: the
      # sha256 written into the cask always comes from the very zip being
      # attached, in the same run.
      - name: Attach zip to release
        run: gh release upload "$GITHUB_REF_NAME" "NotificationNanny-${{ steps.version.outputs.version }}.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update cask
        run: |
          sed -i '' 's/version "[^"]*"/version "${{ steps.version.outputs.version }}"/' Casks/notificationnanny.rb
          sed -i '' 's/sha256 "[^"]*"/sha256 "${{ steps.sha.outputs.sha256 }}"/' Casks/notificationnanny.rb

      - name: Commit cask
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/notificationnanny.rb
          git commit -m "chore: bump cask to v${{ steps.version.outputs.version }}"
          git push origin HEAD:main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

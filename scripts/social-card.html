<!DOCTYPE html>
<!--
  Source for site/assets/social-card.png, the 1200x630 og:image / twitter:image.
  Same type and colours as the landing page hero, dark appearance. To regenerate:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
      --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 \
      --screenshot="$PWD/site/assets/social-card.png" "file://$PWD/scripts/social-card.html"

  Chrome can keep running after it has written the file; stop it once the PNG is there.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1c21;
      color: rgba(255, 255, 255, 0.94);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-align: center;
    }
    img {
      width: 132px;
      height: 132px;
      border-radius: 30px;
      box-shadow: 0 14px 32px -16px rgba(0, 0, 0, 0.7);
      margin-bottom: 40px;
    }
    h1 {
      margin: 0 0 24px;
      font-size: 64px;
      line-height: 1.12;
      letter-spacing: -0.02em;
      font-weight: 650;
    }
    p {
      margin: 0;
      font-size: 24px;
      color: rgba(255, 255, 255, 0.62);
    }
    .name { color: #e8833a; font-weight: 600; }
  </style>
</head>
<body>
  <img src="../site/assets/icon-512.png" alt="" />
  <h1>Don't let macOS decide<br />where your notifications go.</h1>
  <p><span class="name">NotificationNanny</span> · free and open source for macOS</p>
</body>
</html>
